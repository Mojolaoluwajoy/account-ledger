# Fixed project name, so container and volume names stay the same whatever
# the folder is called.
name: account-ledger

services:
  postgres:
    image: postgres:15
    container_name: account-ledger-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    # Healthy only once init-db.sql has finished: the check connects over TCP
    # (closed while the image runs its init scripts) to the last database
    # that script creates.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U root -d ledger_service_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  client-service:
    build: ./client-service
    container_name: client-service
    ports:
      - "8086:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/client_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: postgres
      FINERACT_BASE_URL: https://sandbox.mifos.community/fineract-provider/api/v1
      FINERACT_TENANT_ID: default
      FINERACT_USERNAME: mifos
      FINERACT_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  savings-service:
    build: ./savings-service
    container_name: savings-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/savings_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: postgres
      LEDGER_SERVICE_URL: http://ledger-service:8084
      CLIENT_SERVICE_URL: http://client-service:8081
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  fixed-deposit-service:
    build: ./fixed-deposit-service
    container_name: fixed-deposit-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fixed_deposit_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: postgres
      LEDGER_SERVICE_URL: http://ledger-service:8084
      CLIENT_SERVICE_URL: http://client-service:8081
      SAVINGS_SERVICE_URL: http://savings-service:8082
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  ledger-service:
    build: ./ledger-service
    container_name: ledger-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8080"
    environment:
      CLIENT_SERVICE_URL: http://client-service:8081
      SAVINGS_SERVICE_URL: http://savings-service:8082
      FIXED_DEPOSIT_SERVICE_URL: http://fixed-deposit-service:8083
      LEDGER_SERVICE_URL: http://ledger-service:8084
    depends_on:
      - client-service
      - savings-service
      - fixed-deposit-service
      - ledger-service

volumes:
  postgres-data: