spring.application.name=savings-service

# In-memory database so tests do not need a running Postgres
spring.datasource.url=jdbc:h2:mem:savings_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

# Migrations are PostgreSQL SQL; on H2 Hibernate builds the schema from the entities instead
spring.flyway.enabled=false
