spring.application.name=client-service

# In-memory database so tests do not need a running Postgres
spring.datasource.url=jdbc:h2:mem:client_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

# Fineract (never called in tests)
fineract.tenant-id=default
fineract.username=test
fineract.password=test
fineract.base-url=http://localhost:0/fineract-provider/api/v1
