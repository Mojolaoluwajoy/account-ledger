spring.application.name=client-service
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/client_service_db
spring.datasource.username=root
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Fineract
fineract.tenant-id=default
fineract.username=mifos
fineract.password=password
fineract.base-url=https://sandbox.mifos.community/fineract-provider/api/v1

# Calls to Fineract give up rather than hang a request (the defaults are 10s to
# connect and 60s to read). A client whose call times out stays PENDING and is
# retried; the retry looks the client up in Fineract first, so it is never
# created twice.
spring.cloud.openfeign.client.config.fineract-client-service.connect-timeout=5000
spring.cloud.openfeign.client.config.fineract-client-service.read-timeout=10000

# Only set to true for a local Fineract with a self-signed certificate
fineract.ssl.trust-all=false

# Retry clients that failed to reach Fineract (still PENDING)
fineract.sync.retry-enabled=true
fineract.sync.retry-delay-ms=60000

# Flyway
# A database created before Flyway was introduced is marked as version 1 and
# only receives the later migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
