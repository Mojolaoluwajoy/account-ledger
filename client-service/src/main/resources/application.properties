spring.application.name=client-service
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/client_service_db
spring.datasource.username=root
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Fineract
fineract.tenant-id=default
fineract.username=mifos
fineract.password=password
fineract.base-url=https://apis.mifos.community/fineract-provider/api/v1

# Only set to true for a local Fineract with a self-signed certificate
fineract.ssl.trust-all=false

# Retry clients that failed to reach Fineract (still PENDING)
fineract.sync.retry-enabled=true
fineract.sync.retry-delay-ms=60000
