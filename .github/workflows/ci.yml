name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles every service, runs the tests (on in-memory H2, no Postgres
      # needed) and fails if the code is not formatted with Spotless.
      - name: Build, test and check formatting
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Check docker-compose.yml
        run: docker compose config --quiet

      # The Dockerfiles copy in the jars built above.
      - name: Build Docker images
        run: docker compose build
