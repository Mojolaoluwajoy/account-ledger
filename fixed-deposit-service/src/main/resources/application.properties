spring.application.name=fixed-deposit-service
server.port=8083

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/fixed_deposit_service_db
spring.datasource.username=root
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Give up after 3 seconds when a row is locked by another request (for example
# a deposit waiting on a transfer) instead of waiting indefinitely. Kept below
# the 5 second Feign read timeout of the services that call us.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'

# JPA
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
# A database created before Flyway was introduced is marked as version 1 and
# only receives the later migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Calls to the client, savings and ledger services give up rather than hang
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
