server:
  port: 8080

# Where each backend lives. Defaults suit running everything on your machine;
# docker-compose overrides them with container names.
services:
  client: ${CLIENT_SERVICE_URL:http://localhost:8081}
  savings: ${SAVINGS_SERVICE_URL:http://localhost:8082}
  fixed-deposit: ${FIXED_DEPOSIT_SERVICE_URL:http://localhost:8083}
  ledger: ${LEDGER_SERVICE_URL:http://localhost:8084}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: client-service
              uri: ${services.client}
              predicates:
                - Path=/api/v1/clients/**

            - id: savings-products
              uri: ${services.savings}
              predicates:
                - Path=/api/v1/savings-products/**

            - id: savings-accounts
              uri: ${services.savings}
              predicates:
                - Path=/api/v1/savings-accounts/**

            - id: fixed-deposits
              uri: ${services.fixed-deposit}
              predicates:
                - Path=/api/v1/fixed-deposits/**

            # Operational endpoints: list and retry failed ledger postings
            # and payouts.
            - id: savings-admin
              uri: ${services.savings}
              predicates:
                - Path=/api/v1/admin/savings/**

            - id: fixed-deposits-admin
              uri: ${services.fixed-deposit}
              predicates:
                - Path=/api/v1/admin/fixed-deposits/**

            - id: ledger
              uri: ${services.ledger}
              predicates:
                - Path=/api/v1/ledger/**

            # API descriptions of each service, shown together in the
            # gateway's Swagger UI (see springdoc below).
            - id: client-service-docs
              uri: ${services.client}
              predicates:
                - Path=/docs/client-service
              filters:
                - SetPath=/v3/api-docs

            - id: savings-service-docs
              uri: ${services.savings}
              predicates:
                - Path=/docs/savings-service
              filters:
                - SetPath=/v3/api-docs

            - id: fixed-deposit-service-docs
              uri: ${services.fixed-deposit}
              predicates:
                - Path=/docs/fixed-deposit-service
              filters:
                - SetPath=/v3/api-docs

            - id: ledger-service-docs
              uri: ${services.ledger}
              predicates:
                - Path=/docs/ledger-service
              filters:
                - SetPath=/v3/api-docs

# One Swagger UI for every service: http://<gateway>/swagger-ui.html
# Pick a service from the dropdown at the top right.
springdoc:
  swagger-ui:
    urls:
      - name: Client Service
        url: /docs/client-service
      - name: Savings Service
        url: /docs/savings-service
      - name: Fixed Deposit Service
        url: /docs/fixed-deposit-service
      - name: Ledger Service
        url: /docs/ledger-service

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
