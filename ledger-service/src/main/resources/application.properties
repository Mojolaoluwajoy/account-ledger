spring.application.name=ledger-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_service_db
spring.datasource.username=root
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
# A database created before Flyway was introduced is marked as version 1 and
# only receives the later migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
